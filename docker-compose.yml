version: '3.8'

services:
  frontend:
    build:
      context: ./frontend-user
      dockerfile: Dockerfile
    container_name: zhiyun-website
    ports:
      - "8081:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
